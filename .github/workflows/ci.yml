name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v
      # Eval smoke test: the deterministic (no-LLM) mode over all 50 labeled cases.
      - run: python evals/run_eval.py --mode heuristics --split all --out /tmp/heuristics-all.json
